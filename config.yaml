baseURL: https://harringa.com
disablePathToLower: true
languageCode: en-us
ignoreFiles: [
    "build/*"
  ]
title: Harringa.com
description: Generally used as a playground for Justin Harringa but also includes blog posts. Of course, all of that is subject to change.

# Links format
permalinks:
  posts: posts/:year/:month/:title/

taxonomies:
  category: categories
  tag: tags

services:
  googleAnalytics:
    ID: "G-JEBDNF11BH"

disqusShortname: "harringa"

theme: bota

# Hugo 0.162.0 disallows text/html content files by default via security.allowContent.
# This site has hand-authored .html posts (migrated from Blogger), so opt back in.
security:
  allowContent:
    - '.*'

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  author: Justin Harringa
  siteDescription: Generally used as a playground for Justin Harringa but also includes blog posts. Of course, all of that is subject to change.
  blogPostTaxonomy: posts

menu:
  main:
  - name: Blog Posts
    url: /posts/
    weight: -100
  - name: Links
    url: /links/
    weight: -80
